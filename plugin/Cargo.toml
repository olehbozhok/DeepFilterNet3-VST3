[package]
name = "deepfilter-vst"
version = "0.6.0"
edition = "2021"
build = "build.rs"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["model-ll"]
# At most one of these, or none.
#
#   model-ll         DeepFilterNet's own low-latency model (the default)
#   model-standard   DeepFilterNet's own standard model
#   model-shortwave  the model this project trained for shortwave AM speech,
#                    bundled at models/dfn3-shortwave-v1_onnx.tar.gz. Always
#                    that one, so a clone builds the same binary.
#   model-custom     the archive named by DEEPFILTER_EMBED_MODEL, for trying a
#                    candidate before adopting it. Fails the build if unset.
#   none             no model in the binary; DEEPFILTER_MODEL is required at
#                    run time and the plugin refuses to start without it.
#
# Each brings in at most one DeepFilterNet model feature, so two can never be
# embedded together - they differ in lookahead, and a binary holding both could
# report the wrong latency to the host.
model-ll = ["df/default-model-ll"]
model-standard = ["df/default-model"]
model-shortwave = []
model-custom = []

[dependencies]
nice-plug = "=0.2.3"
nice-plug-egui = "=0.3.0"
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }

df = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", package = "deep_filter", default-features = false, features = ["tract"] }

ndarray = "0.15"
log = "0.4"
rubato = "=0.14.1"
rtrb = "=0.3.3"
