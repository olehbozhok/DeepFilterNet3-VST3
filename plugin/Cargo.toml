[package]
name = "deepfilter-vst"
version = "0.6.0"
edition = "2021"
build = "build.rs"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["model-ll"]
# Exactly one of these, or none. `model-embedded` compiles in a model of our own
# from the path in DEEPFILTER_EMBED_MODEL, and pulls in no DeepFilterNet model
# feature at all, so the two are never both present. With none of them the
# plugin carries no model and requires DEEPFILTER_MODEL at run time.
model-ll = ["df/default-model-ll"]
model-standard = ["df/default-model"]
model-embedded = []

[dependencies]
nice-plug = "=0.2.3"
nice-plug-egui = "=0.3.0"
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }

df = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", package = "deep_filter", default-features = false, features = ["tract"] }

ndarray = "0.15"
log = "0.4"
rubato = "=0.14.1"
rtrb = "=0.3.3"
